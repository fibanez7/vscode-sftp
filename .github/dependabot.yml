version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Group updates so we get a few PRs, not one per package.
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      # Major upgrades need manual migration (project pins the TypeScript 3.9 toolchain;
      # several deps have ESM-only / breaking majors). Bump these by hand when ready.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
