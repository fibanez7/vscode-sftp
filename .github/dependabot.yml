version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Maintenance mode: no routine version-update PRs (the TypeScript 3.9 toolchain
    # and engines.vscode ^1.64.2 are pinned on purpose; most bumps break the build).
    # Dependabot security updates are not affected by this limit and still open PRs
    # for real vulnerabilities.
    open-pull-requests-limit: 0
